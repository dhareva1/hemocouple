[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hemocouple"
version = "0.1.0"
description = "Physics-informed neural operators for 1D-3D hemodynamic interface coupling"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.9", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# numpy 2.0.x + macOS Accelerate emits spurious FP warnings from matmul; results are checked by the tests.
filterwarnings = ["ignore:.*encountered in matmul:RuntimeWarning"]
